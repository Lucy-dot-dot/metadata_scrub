<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26454F"/>
      <stop offset="1" stop-color="#132A33"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="52" y="54" width="152" height="136" rx="18"/>
    </clipPath>
    <g transform="translate(186 166) rotate(-18)" id="eraser">
      <rect x="-29" y="-17" width="58" height="34" rx="8" fill="#E5A33D"/>
      <path d="M-29 4 h58 v5 a8 8 0 0 1 -8 8 h-42 a8 8 0 0 1 -8 -8 z" fill="#B97B26"/>
      <rect x="-22" y="-12" width="28" height="5" rx="2.5" fill="#F2C477" opacity="0.85"/>
    </g>
  </defs>

  <!-- background -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bg)"/>
  <rect x="18" y="18" width="220" height="220" rx="50" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <!-- card drop shadow -->
  <rect x="52" y="62" width="152" height="136" rx="18" fill="#081419" opacity="0.45"/>

  <!-- photo card -->
  <rect x="52" y="54" width="152" height="136" rx="18" fill="#F5F1E8"/>
  <g clip-path="url(#card-clip)">
    <circle cx="170" cy="92" r="13" fill="#E5A33D"/>
    <polygon points="66,140 118,84 170,140" fill="#2F7E6D"/>
    <polygon points="110,140 152,100 196,140" fill="#3EA28B"/>
  </g>

  <!-- metadata lines being erased -->
  <g fill="#3A5560">
    <rect x="66" y="150" width="34" height="8" rx="4" opacity="0.95"/>
    <rect x="108" y="150" width="26" height="8" rx="4" opacity="0.50"/>
    <rect x="142" y="150" width="18" height="8" rx="4" opacity="0.20"/>

    <rect x="66" y="164" width="26" height="8" rx="4" opacity="0.95"/>
    <rect x="100" y="164" width="30" height="8" rx="4" opacity="0.50"/>
    <rect x="138" y="164" width="14" height="8" rx="4" opacity="0.20"/>

    <rect x="66" y="178" width="38" height="8" rx="4" opacity="0.95"/>
    <rect x="112" y="178" width="20" height="8" rx="4" opacity="0.50"/>
    <rect x="140" y="178" width="16" height="8" rx="4" opacity="0.20"/>
  </g>

  <!-- eraser -->
  <use href="#eraser"/>
</svg>
